apiVersion: apps/v1
kind: Deployment
metadata:
  name: arsis
  namespace: nyantech
  labels:
    app: arsis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arsis
  template:
    metadata:
      labels:
        app: arsis
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arsis
          image: ghcr.io/atis9/arsis:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: arsis-secret
                  key: discord-token
            - name: RUST_LOG
              value: arsis=info
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 50m
              memory: 50Mi
