[package]
name = "arsis"
version = "0.3.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
log = "0.4.33"
env_logger = "0.11.11"
# Preserve Poise's non-TLS defaults while avoiding Serenity's legacy rustls stack.
poise = { version = "0.6.2", default-features = false, features = ["cache", "chrono", "handle_panics"] }
serenity = { version = "0.12.5", default-features = false, features = ["native_tls_backend"] }
